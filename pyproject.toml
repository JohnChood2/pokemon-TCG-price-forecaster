[project]
name = "pokemon-price-forecaster"
version = "0.1.0"
description = "Forecast Pokémon TCG card prices and serve predictions via REST API."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "John C. Hood II" }]
license = { text = "MIT" }

# Core runtime dependencies — needed to run the API in production.
dependencies = [
    # Data + storage
    "pandas>=3.0.3",
    "numpy>=2.4.6,<2.5",        # prophet/xgboost compat ceiling
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27",
    "tenacity>=8.4",           # retries on the API client
    # ML
    "scikit-learn>=1.9.0",
    "xgboost>=2.1",
    "prophet>=1.1.5",
    "joblib>=1.4",
    # API
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# `uv sync --extra frontend` to install the Streamlit UI deps.
frontend = ["streamlit>=1.59.2", "plotly>=6.9.0"]

# `uv sync --extra dev` for local development.
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "pre-commit>=3.7",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
]

[project.scripts]
# After `uv sync`, these are runnable as `uv run pokemon-api`, etc.
pokemon-api = "pokemon_forecaster.api.main:run"
pokemon-ingest = "pokemon_forecaster.cli.ingest:main"
pokemon-train = "pokemon_forecaster.cli.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_forecaster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]   # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=pokemon_forecaster --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
