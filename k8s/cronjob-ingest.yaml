apiVersion: batch/v1
kind: CronJob
metadata:
  name: pokemon-ingest-daily
spec:
  # Once a day at 06:00 UTC. Adjust to taste.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: ghcr.io/YOUR_GITHUB_USER/pokemon-price-forecaster:latest
              command: ["python", "-m", "pokemon_forecaster.cli.ingest"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: forecaster-secrets, key: database_url }
                - name: POKEMONTCG_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: forecaster-secrets
                      key: pokemontcg_api_key
                      optional: true
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits:   { cpu: 500m, memory: 512Mi }
